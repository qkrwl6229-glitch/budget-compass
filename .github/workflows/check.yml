name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 구조 검사
        run: python3 tools/validate.py
      - name: 계산기 테스트
        run: python3 -m unittest discover -s tests -v
      - name: 패키지 생성
        run: bash tools/package.sh
